        <div class="field"><label for="rem">Email</label><input class="input" id="rem" type="email" autocomplete="email" required></div>
        <div class="field"><label for="rpw">New password</label><input class="input" id="rpw" type="password" autocomplete="new-password" required></div>
        <div id="rerr"></div>
        <div class="wrap" style="justify-content:flex-end;margin-top:8px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save password</button></div>
      </form>`);
    d.querySelector('#rf').addEventListener('submit', async ev => {
      ev.preventDefault();
      const email = d.querySelector('#rem').value, password = d.querySelector('#rpw').value;
      try{ await API.resetPassword({ email, password }); Dialog.close(); Toast('Password updated. Sign in when ready.'); }
      catch(err){ d.querySelector('#rerr').innerHTML = `<div class="err-msg">${ico('alert-circle',14)}<span>${esc(err.message)}</span></div>`; icons(); }
    });
  });

  $('#af').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#sub'), ferr = $('#formerr');
    ferr.innerHTML = '';
    const email = $('#em'), pw = $('#pw');
    let ok = true;
    if(!V.email(email.value)){ setErr(email, 'Check this email address.'); ok = false; } else setErr(email, null);
    if(pw.value.length < 8){ setErr(pw, 'At least 8 characters, please.'); ok = false; } else setErr(pw, null);
    if(isUp){
      const nm = $('#nm'), pw2 = $('#pw2');
      if(nm.value.trim().length < 2){ setErr(nm, 'A name of two letters or more.'); ok = false; } else setErr(nm, null);
      if(pw2.value !== pw.value){ setErr(pw2, 'These two do not match yet.'); ok = false; } else setErr(pw2, null);
    }
    if(!ok) return;
    btn.disabled = true; btn.innerHTML = `<span class="orbit" style="width:18px;height:18px"></span><span>${isUp?'Making your corner':'Opening your space'}</span>`;
    try{
      State.me = isUp
        ? await API.signup({ name:$('#nm').value, email:email.value, password:pw.value })
        : await API.login({ email:email.value, password:pw.value, remember:$('#rm').checked });
      // Keep signup reliable when the file is opened directly or served locally.
      // Hash navigation is used instead of a hard redirect so the app stays in one document.
      const nextRoute = isUp ? '#/onboarding' : '#/app/dashboard';
      window.location.hash = nextRoute.slice(1);
      await route();
      if(!isUp) Toast(`Welcome back, ${State.me.name.split(' ')[0]}.`, 'warm');
    }catch(err){
      btn.disabled = false; btn.textContent = isUp ? 'Begin your journey' : 'Sign in';
      ferr.innerHTML = `<div class="err-msg">${ico('alert-circle',14)}<span>${esc(err.message)}</span></div>`; icons();
    }
  });
}

   ONBOARDING
   ============================================================ */
async function Onboarding(){
  const me = State.me;
  let step = 0, picks = new Set(me.profile.reasons || []), goals = (me.profile.goals || []).slice();
  const first = me.name.split(' ')[0];

  function draw(){
    render(`
    <div class="onb">
      <div class="blob b2" style="left:-6%;top:10%"></div>
      <div class="onb-inner">
        <div class="row" style="justify-content:space-between;margin-bottom:32px">${brand(28)}<span class="meta">Step ${step+1} of 2</span></div>
        <div class="onb-steps">${[0,1].map(i => `<i class="${i<=step?'on':''}"></i>`).join('')}</div>
        ${step === 0 ? `
          <span class="eyebrow">Welcome, ${esc(first)}</span>
          <h1 class="h1" style="margin:14px 0 12px">What brings you to Solace?</h1>
          <p class="lead">Pick as many as feel true. This shapes what Solace offers you first, and you can change it whenever.</p>
          <div class="pick-grid">
            ${REASONS.map(r => `<button class="pick" type="button" data-r="${esc(r)}" aria-pressed="${picks.has(r)}"><span class="dot"></span><span>${esc(r)}</span></button>`).join('')}
          </div>
          <div class="wrap" style="margin-top:32px;justify-content:space-between;align-items:center">
            <span class="meta">${picks.size ? `${picks.size} selected` : 'Nothing selected yet'}</span>
            <div class="wrap"><button class="btn quiet" id="skip">Skip for now</button><button class="btn" id="next" ${picks.size?'':'disabled'}>Continue ${ico('arrow-right',16)}</button></div>
          </div>` : `
          <span class="eyebrow">Almost there</span>
          <h1 class="h1" style="margin:14px 0 12px">Anything you are working towards?</h1>
          <p class="lead">One line each. Plain and small is better than grand. Leave it blank if you would rather not.</p>
          <div class="stack" style="gap:12px;margin-top:28px;max-width:560px">
            ${[0,1,2].map(i => `<input class="input" data-g="${i}" placeholder="${['Sleep before midnight most nights','Move my body four days a week','Be kinder to myself on hard days'][i]}" value="${esc(goals[i]||'')}">`).join('')}
          </div>
          <div class="wrap" style="margin-top:32px;justify-content:space-between">
            <button class="btn quiet" id="back">${ico('chevron-left',16)} Back</button>
            <button class="btn" id="finish">Enter Solace</button>
          </div>`}
      </div>
    </div>`);

    if(step === 0){
      $$('.pick').forEach(b => b.addEventListener('click', () => {
        const r = b.dataset.r;
        picks.has(r) ? picks.delete(r) : picks.add(r);
        b.setAttribute('aria-pressed', picks.has(r));
        $('#next').disabled = !picks.size;
        $('.meta').textContent = picks.size ? `${picks.size} selected` : 'Nothing selected yet';
      }));
      $('#next').addEventListener('click', () => { step = 1; draw(); });
      $('#skip').addEventListener('click', finish);
    } else {
      $('#back').addEventListener('click', () => { step = 0; draw(); });
      $('#finish').addEventListener('click', () => { goals = $$('[data-g]').map(i => i.value.trim()).filter(Boolean); finish(); });
    }
  }
  async function finish(){
    State.me = await API.updateMe({ reasons: Array.from(picks), goals, onboarded:true });
    go('/app/dashboard', true);
    Toast('Your corner is ready.', 'warm');
  }
  draw();
}

  const days = Domain.activeDays(snap);

  const todayMood = snap.moods.find(m => m.day === D.today());

            <span class="meta ital">${lastGrat ? `&ldquo;${esc(lastGrat.text.slice(0,52))}${lastGrat.text.length>52?'…':''}&rdquo;` : 'Your jar is empty. What is one little thing worth keeping?'}</span>
          </div>

/* ============================================================
   MOOD
   ============================================================ */
async function MoodPage(){
  skeletonPage();
  const moods = await API.listMoods();
  const today = D.today();
  let editing = moods.find(m => m.day === today) || null;
  let win = 30, view = 'chart';
  const quick = sessionStorage.getItem('solace.quickmood');
  sessionStorage.removeItem('solace.quickmood');
  let form = editing ? { ...editing } : { day:today, mood: quick ? +quick : 3, energy:3, stress:3, sleep:3, present:[], note:'' };
  const map = k => Object.fromEntries(moods.map(m => [m.day, m[k]]));

  function drawHistory(){
    const days = D.range(win);
    const inRange = moods.filter(m => D.diff(today, m.day) < win).sort((a,b)=> a.day<b.day?-1:1);
    const box = $('#hist');
    if(!inRange.length){ box.innerHTML = `<div class="empty"><h3 class="h3">Nothing charted yet for this stretch</h3><p>Check in a few times and your rhythm starts to show.</p></div>`; return; }
    if(view === 'chart'){
      box.innerHTML = `
        ${lineChart([
          { name:'Mood', color:'var(--plum-soft)', fill:true, dots: win<=30, map: map('mood') },
          { name:'Energy', color:'var(--gold-2)', w:1.8, map: map('energy') },
          { name:'Sleep', color:'var(--sky-2)', w:1.6, dash:'4 5', op:.9, map: map('sleep') },
          { name:'Stress', color:'var(--blush-2)', w:1.6, dash:'2 6', op:.85, map: map('stress') }
        ], days, { aria:`Mood, energy, sleep and stress over ${win} days` })}
        <div class="legend" style="margin-top:14px">
          <span><i class="swatch" style="background:var(--plum-soft)"></i>Mood</span>
          <span><i class="swatch" style="background:var(--gold-2)"></i>Energy</span>
          <span><i class="swatch" style="background:var(--sky-2)"></i>Sleep</span>
          <span><i class="swatch" style="background:var(--blush-2)"></i>Stress</span>
        </div>`;
    } else if(view === 'cal'){
      const start = D.shift(today, -(win-1));
      const pad = (D.parse(start).getDay()+6)%7;
      const cells = [];
      for(let i=0;i<pad;i++) cells.push('<div></div>');
      D.range(win).forEach(d => {
        const m = moods.find(x => x.day === d);
        const bg = m ? ['oklch(80% 0.03 265)','oklch(86% 0.03 290)','oklch(90% 0.028 295)','oklch(91% 0.05 90)','oklch(88% 0.08 82)'][m.mood-1] : '';
        cells.push(`<div class="cell ${m?'has':''} ${d===today?'today':''}" ${m?`data-day="${d}" style="background:${bg}" title="${D.long(d)} · ${MOOD_LABELS[m.mood]}" tabindex="0" role="button"`:''}>${D.parse(d).getDate()}</div>`);
      });
      box.innerHTML = `<div class="cal">${['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div>
        <p class="meta" style="margin-top:16px">Deeper gold reads brighter, cooler blue reads lower. Tap a day to open it.</p>`;
      $$('#hist .cell.has').forEach(c => {
        const open = () => { form = { ...moods.find(m => m.day === c.dataset.day) }; drawForm(); window.scrollTo({ top:0, behavior:'smooth' }); };
        c.addEventListener('click', open);
        c.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
      });
    } else {
      box.innerHTML = inRange.slice().reverse().map(m => `
        <div class="entry-row">
          <span class="when">${D.relative(m.day)}</span>
          ${moodOrb(m.mood, 38)}
          <div class="stack grow" style="gap:3px">
            <span class="small" style="font-weight:600">${MOOD_LABELS[m.mood]} · energy ${m.energy}/5 · sleep ${m.sleep}/5</span>
            ${(m.present||[]).length ? `<span class="wrap" style="gap:5px;margin-top:2px">${m.present.map(p=>`<span class="chip tag">${esc(p)}</span>`).join('')}</span>` : ''}
            ${m.note ? `<span class="meta ital" style="max-width:60ch">&ldquo;${esc(m.note)}&rdquo;</span>` : ''}
          </div>

function moodResponse(f){
  if(f.mood <= 2 && f.energy <= 2) return { head:'Thank you for saying so', body:'You seem a little drained today. Maybe today does not need to be a day of pushing. A slower evening might help.' };
  if(f.stress >= 4 && f.sleep <= 2) return { head:'That is a lot at once', body:'Tension and thin sleep tend to travel together. One small kindness now counts more than a plan for tomorrow.' };
  if(f.stress >= 4) return { head:'Held tightly today', body:'Something is pulling at you. Four slow breaths in the Calm Space, then decide what actually needs you.' };
  if(f.mood >= 4 && f.energy >= 4) return { head:'A good one', body:'Worth marking. Days like this are easier to remember later if you write down one line about them.' };
  if(f.mood >= 4) return { head:'Steady and bright', body:'Nothing needs fixing. Maybe drop one thing in the jar while it is fresh.' };
  if(f.sleep >= 4) return { head:'Rested', body:'You slept well, which tends to make everything else quieter. Keep whatever you did last night.' };
  return { head:'Noted', body:'An okay day is a real day. It does not need to be more than that.' };
}

    </div>

  icons();
  const t = $('#title'), b = $('#body');
  const upd = () => { $('#wc').textContent = `${words()} word${words()===1?'':'s'}`; };
  upd();
  b.addEventListener('input', () => { dirty = true; upd(); $('#status').textContent = 'Unsaved'; });
  t.addEventListener('input', () => { dirty = true; $('#status').textContent = 'Unsaved'; });
  b.focus();
  const gp = $('#getprompt');
  gp && gp.addEventListener('click', () => { entry.prompt = PROMPTS[Math.floor(Math.random()*PROMPTS.length)]; Writer(entry.id || 'new'), setTimeout(()=>{},0);
    /* re-render preserving current text */
    const keep = { ...entry, title:t.value, body:b.value };
    entry = keep; renderPromptCard(); });
  function renderPromptCard(){
    const wrap = $('.writer-body');

    wrap.replaceChild(node, first);

    const wrap = $('.writer-body');
    const node = el('div',{class:'wrap',style:'gap:10px'}, `<button class="btn ghost sm" id="getprompt">${ico('sparkles',14)} Give me a prompt</button>`);
    wrap.replaceChild(node, wrap.firstElementChild); icons();

  $$('[data-m]').forEach(x => x.addEventListener('click', () => { entry.mood = entry.mood === +x.dataset.m ? null : +x.dataset.m; $$('[data-m]').forEach(y=>y.setAttribute('aria-pressed', entry.mood === +y.dataset.m)); }));

  });
  async function persist(draft){
    const payload = { ...entry, title:t.value, body:b.value, tags: $('#tags').value.split(',').map(s=>s.trim()).filter(Boolean), draft };
    try{
      const saved = await API.saveJournal(payload);

  $('#save').addEventListener('click', () => persist(false));
  const auto = setInterval(() => { if(dirty && (t.value.trim() || b.value.trim())) persist(true); }, 20000);
  window.addEventListener('hashchange', () => clearInterval(auto), { once:true });
}

async function VisionPage(){

  if(!boards.some(b => b.id === boardId)) boardId = boards[0].id;
  let filter = '';

  function drawItems(){
    const board = $('#board');
    const mine = items.filter(i => i.boardId === boardId && (!filter || i.category === filter));
    if(!mine.length){
      board.innerHTML = `<div class="empty" style="padding-top:16%"><h3 class="h3">This board is still open sky.</h3><p>Add a picture, a line you want to keep, or a plain goal. Drag anything anywhere.</p></div>`;
      return;
    }
    board.innerHTML = mine.map(i => `
      <div class="vi ${i.type}" data-id="${i.id}" style="left:${i.x}%;top:${i.y}%" tabindex="0" role="group" aria-label="${esc(i.text || 'image')}">
        <button class="vdel" data-del="${i.id}" aria-label="Remove item">${ico('x',14)}</button>
        ${i.type === 'image' ? `<img src="${esc(i.src)}" alt="${esc(i.text||'Vision image')}">${i.text?`<div class="small" style="padding:8px 8px 4px">${esc(i.text)}</div>`:''}`
          : i.type === 'quote' ? `<p class="vq">&ldquo;${esc(i.text)}&rdquo;</p>`
          : `<p class="${i.type==='goal'?'vt':'vt'}">${i.type==='goal'?ico('target',15)+' ':''}${esc(i.text)}</p>`}
        ${i.category ? `<span class="vcat">${esc(i.category)}</span>` : ''}
      </div>`).join('');
    icons();
    $$('#board .vi').forEach(makeDraggable);
    $$('#board [data-del]').forEach(b => b.addEventListener('click', async e => {
      e.stopPropagation();
      await API.deleteBoardItem(b.dataset.del);
      const i = items.findIndex(x => x.id === b.dataset.del); items.splice(i,1);
      drawItems(); Toast('Removed from the board.');
    }));
  }
  function makeDraggable(node){
    let start = null;
    const board = $('#board');
    node.addEventListener('pointerdown', e => {
      if(e.target.closest('button')) return;
      const r = board.getBoundingClientRect(), n = node.getBoundingClientRect();
      start = { px:e.clientX, py:e.clientY, ox:n.left - r.left, oy:n.top - r.top, w:r.width, h:r.height, nw:n.width, nh:n.height };
      node.classList.add('dragging'); node.setPointerCapture(e.pointerId);
    });
    node.addEventListener('pointermove', e => {
      if(!start) return;
      const x = clamp(start.ox + (e.clientX - start.px), 0, start.w - start.nw);
      const y = clamp(start.oy + (e.clientY - start.py), 0, start.h - start.nh);
      node.style.left = (x / start.w * 100) + '%';
      node.style.top = (y / start.h * 100) + '%';
    });
    node.addEventListener('pointerup', async () => {
      if(!start) return;
      node.classList.remove('dragging'); start = null;
      const x = parseFloat(node.style.left), y = parseFloat(node.style.top);
      const upd = await API.moveBoardItem(node.dataset.id, x, y);
      const i = items.findIndex(it => it.id === upd.id); items[i] = upd;
    });
    node.addEventListener('keydown', async e => {
      const step = e.shiftKey ? 6 : 2;
      const map = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] };
      if(!map[e.key]) return;
      e.preventDefault();
      const it = items.find(x => x.id === node.dataset.id);
      const upd = await API.moveBoardItem(it.id, it.x + map[e.key][0], it.y + map[e.key][1]);
      const i = items.findIndex(x => x.id === upd.id); items[i] = upd;
      node.style.left = upd.x + '%'; node.style.top = upd.y + '%';
    });
  }

  function addDialog(){
    const d = Dialog.open(`
      <h2 class="h3" style="margin-bottom:6px">Add to your vision</h2>
      <p class="mute small" style="margin-bottom:22px">Words, a goal, a quote, or a picture.</p>
      <div class="wrap" style="gap:8px;margin-bottom:20px" id="tsel">
        ${[['text','Note','type'],['goal','Goal','target'],['quote','Quote','quote'],['image','Image','image']].map((t,i)=>`<button class="chip ${i?'':'on'}" data-t="${t[0]}">${ico(t[2],14)} ${t[1]}</button>`).join('')}

/* ============================================================
   HABIT GARDEN
   ============================================================ */
async function GardenPage(){
  skeletonPage();
  const { habits, completions } = await API.listHabits();
  let view = sessionStorage.getItem('solace.gardenview') || 'garden';
  let showArchived = false;
  const live = () => habits.filter(h => showArchived ? h.archived : !h.archived);
  const today = D.today();

  function habitDialog(h){
    const isNew = !h;
    h = h || { name:'', category:'Wellbeing', frequency:'daily', reminder:'none', theme:0, startDay:today };
    const d = Dialog.open(`
      <h2 class="h3" style="margin-bottom:6px">${isNew ? 'Plant a habit' : 'Tend this habit'}</h2>
      <p class="mute small" style="margin-bottom:22px">Small enough to do on your worst day is the right size.</p>
      <form id="hf" class="stack" style="gap:16px" novalidate>
        <div class="field"><label for="hn">What is it?</label><input class="input" id="hn" value="${esc(h.name)}" placeholder="Ten minutes outside" required></div>
        <div style="display:grid;gap:16px;grid-template-columns:1fr 1fr">
          <div class="field"><label for="hc">Category</label><select class="input" id="hc">${HABIT_CATEGORIES.map(c=>`<option ${c===h.category?'selected':''}>${c}</option>`).join('')}</select></div>
          <div class="field"><label for="hfq">How often</label><select class="input" id="hfq">${['daily','weekly','monthly'].map(f=>`<option value="${f}" ${f===h.frequency?'selected':''}>${f[0].toUpperCase()+f.slice(1)}</option>`).join('')}</select></div>
          <div class="field"><label for="hr">Nudge</label><select class="input" id="hr">${[['none','No nudge'],['morning','Morning'],['midday','Midday'],['evening','Evening']].map(r=>`<option value="${r[0]}" ${r[0]===h.reminder?'selected':''}>${r[1]}</option>`).join('')}</select></div>
          <div class="field"><label for="hs">Starting</label><input class="input" id="hs" type="date" value="${h.startDay}"></div>
        </div>
        <div class="field"><label>Colour</label><div class="wrap" style="gap:9px" id="themes">
          ${HABIT_THEMES.map((t,i)=>`<button type="button" class="chip ${i===h.theme?'on':''}" data-t="${i}"><span style="width:12px;height:12px;border-radius:4px;background:${t.leaf};display:inline-block"></span> ${t.name}</button>`).join('')}
        </div></div>
        <div id="herr"></div>
        <div class="wrap" style="justify-content:space-between;gap:12px">
          ${isNew?'<span></span>':`<button type="button" class="btn danger sm" id="hdel">Remove habit</button>`}
          <div class="wrap" style="gap:12px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">${isNew?'Plant it':'Save'}</button></div>
        </div>
      </form>`);
    let theme = h.theme;
    $$('#themes .chip', d).forEach(c => c.addEventListener('click', () => { theme = +c.dataset.t; $$('#themes .chip', d).forEach(x=>x.classList.toggle('on', x===c)); }));
    const hd = d.querySelector('#hdel');
    hd && hd.addEventListener('click', async () => {
      Dialog.close();
      if(await confirmAsk({ title:`Remove "${h.name}"?`, body:'Its record goes too. Archiving keeps the history instead.', confirm:'Remove it' })){ await API.deleteHabit(h.id); Toast('Removed.'); GardenPage(); }
    });
    d.querySelector('#hf').addEventListener('submit', async e => {
      e.preventDefault();
      try{
        await API.saveHabit({ id:h.id, name:d.querySelector('#hn').value, category:d.querySelector('#hc').value, frequency:d.querySelector('#hfq').value, reminder:d.querySelector('#hr').value, startDay:d.querySelector('#hs').value || today, theme });
        Dialog.close(); Toast(isNew ? 'Planted. It starts as a seed.' : 'Saved.', 'warm'); GardenPage();
      }catch(err){ d.querySelector('#herr').innerHTML = `<div class="err-msg">${ico('alert-circle',14)}<span>${esc(err.message)}</span></div>`; icons(); }
    });
  }

  const doneSet = new Set(completions.filter(c => c.day === today).map(c => c.habitId));
  const totalStars = uniq(completions.map(c => c.day)).sort();

  const gardenHTML = () => live().length ? `<div class="garden">${live().map(h => {
    const g = Domain.habitGrowth(h, completions), s = Domain.habitStreak(h, completions), r = Domain.habitRate(h, completions);
    const done = doneSet.has(h.id);
    const periodLabel = h.frequency === 'daily' ? 'today' : h.frequency === 'weekly' ? 'this week' : 'this month';
    const doneThisPeriod = h.frequency === 'daily' ? done
      : h.frequency === 'weekly' ? completions.some(c => c.habitId === h.id && D.weekKey(c.day) === D.weekKey(today))
      : completions.some(c => c.habitId === h.id && D.monthKey(c.day) === D.monthKey(today));
    return `<article class="plot">
      <button class="icon-btn arch" data-edit="${h.id}" aria-label="Edit ${esc(h.name)}">${ico('pencil',15)}</button>
      <span class="stage">${g.stageName}</span>
      <div class="plant" data-plant="${h.id}">${plantSVG(g.stage, h.theme)}</div>
      <h3>${esc(h.name)}</h3>
      <span class="meta">${esc(h.category)} · ${h.frequency}${g.next ? ` · ${g.toNext} to ${g.next.name.toLowerCase()}` : ''}</span>
      <button class="grow-btn ${doneThisPeriod?'done':''}" data-toggle="${h.id}">${doneThisPeriod ? `${ico('check',14)} Done ${periodLabel}` : `Mark ${periodLabel}`}</button>
      <div class="foot"><span>${s.current} in a row</span><span>best ${s.longest}</span><span>${r}%</span></div>
    </article>`; }).join('')}`
    : `<div class="empty"><div style="width:80px;margin:0 auto 16px">${plantSVG(0,0)}</div>
      <h3 class="h2">${showArchived ? 'Nothing is resting here.' : 'Nothing is growing here yet.'}</h3>
      <p style="margin-top:10px">${showArchived ? 'Archived habits will wait in this corner.' : 'Plant your first habit. It begins as a seed and grows each time you show up.'}</p>
      ${showArchived?'':`<div class="wrap" style="justify-content:center;margin-top:22px"><button class="btn" data-new>Plant a habit</button></div>`}</div>`;

  const constHTML = () => `
    <div class="sky-box">
      ${constellation(totalStars, { h:300 })}
      <div class="row" style="justify-content:space-between;margin-top:18px;flex-wrap:wrap;gap:12px">
        <span class="cap">${totalStars.length} night${totalStars.length===1?'':'s'} lit · lines join days that touched</span>
        <span class="cap">${live().length} habit${live().length===1?'':'s'} growing</span>
      </div>
    </div>
    <div class="garden" style="margin-top:20px">${live().map(h => {
      const days = uniq(completions.filter(c=>c.habitId===h.id).map(c=>c.day)).sort();
      const s = Domain.habitStreak(h, completions);
      return `<article class="plot" style="background:linear-gradient(168deg, oklch(28% 0.04 300), oklch(33% 0.05 285));border-color:transparent">
        <h3 style="color:oklch(96% 0.01 92)">${esc(h.name)}</h3>
        <div style="width:100%">${constellation(days, { h:120 })}</div>
        <div class="foot" style="border-color:oklch(42% 0.04 300);color:oklch(80% 0.02 295)"><span>${days.length} star${days.length===1?'':'s'}</span><span>${s.current} in a row</span></div>
      </article>`; }).join('')}</div>`;

  shell(`<div class="page">
    <div class="page-head">
      <div><span class="eyebrow">Habit Garden</span><h1 class="h1" style="margin-top:10px">${live().length ? 'Tend what is growing.' : 'Plant something small.'}</h1>
      <p>Miss a day and the plant simply pauses. Nothing here resets on you.</p></div>
      <div class="wrap" style="gap:10px">
        <div class="seg" id="gview"><button data-v="garden" class="${view==='garden'?'on':''}">Garden</button><button data-v="const" class="${view==='const'?'on':''}">Constellation</button></div>
        <button class="btn" data-new>${ico('plus',16)} New habit</button>
      </div>
    </div>
    ${habits.some(h=>h.archived) ? `<div class="wrap" style="margin-bottom:18px"><button class="chip" id="archtog" aria-pressed="${showArchived}">${ico('archive',14)} ${showArchived?'Showing resting habits':'Show resting habits'}</button></div>` : ''}
    <div id="gbox">${view === 'garden' ? gardenHTML() : constHTML()}</div>
  </div>`);

  function wire(){
    $$('[data-new]').forEach(b => b.addEventListener('click', () => habitDialog(null)));
    $$('[data-edit]').forEach(b => b.addEventListener('click', () => habitDialog(habits.find(h=>h.id===b.dataset.edit))));
    $$('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.toggle;
      const added = await API.toggleCompletion(id, today);
      const plant = $(`[data-plant="${id}"]`);
      plant && plant.classList.add('popped');
      if(added){
        const h = habits.find(x=>x.id===id);
        const before = Domain.habitGrowth(h, completions);
        completions.push({ habitId:id, day:today });
        const after = Domain.habitGrowth(h, completions);
        Toast(after.stage > before.stage ? `${h.name} is now a ${after.stageName.toLowerCase()}.` : 'Grown a little.', 'warm');
      } else {
        const i = completions.findIndex(c => c.habitId === id && c.day === today);
        if(i>-1) completions.splice(i,1);
        Toast('Unmarked.');
      }
      setTimeout(GardenPage, 420);
    }));
    const at = $('#archtog');
    at && at.addEventListener('click', () => { showArchived = !showArchived; $('#gbox').innerHTML = view==='garden'?gardenHTML():constHTML(); at.setAttribute('aria-pressed', showArchived); at.innerHTML = `${ico('archive',14)} ${showArchived?'Showing resting habits':'Show resting habits'}`; icons(); wire(); });
    $$('#gview button').forEach(b => b.addEventListener('click', () => {
      view = b.dataset.v; sessionStorage.setItem('solace.gardenview', view);
      $$('#gview button').forEach(x=>x.classList.toggle('on', x===b));
      $('#gbox').innerHTML = view === 'garden' ? gardenHTML() : constHTML(); icons(); wire();
    }));
  }
  wire();
}

  function drawList(){

    if(!filtered.length){ box.innerHTML = `<div class="empty" style="padding:32px 0"><h3 class="h3">Nothing matches that</h3><p>Try another word or clear the date.</p></div>`; return; }
    box.innerHTML = `<div class="g-scroll">${filtered.map(g => `
      <div class="g-note">
        <span style="color:var(--gold-2);margin-top:2px">${ico('sparkle',15)}</span>
        <div class="stack grow" style="gap:3px"><p>${esc(g.text)}</p><span class="meta">${D.relative(g.day)}</span></div>
        <span class="wrap" style="gap:0"><button class="icon-btn" data-ed="${g.id}" aria-label="Edit">${ico('pencil',15)}</button><button class="icon-btn" data-dl="${g.id}" aria-label="Delete">${ico('trash-2',15)}</button></span>
      </div>`).join('')}</div>`;

      if(await confirmAsk({ title:'Take this out of the jar?', body:'It will not be kept anywhere else.', confirm:'Remove it' })){ await API.deleteGratitude(b.dataset.dl); Toast('Removed.'); GratitudePage(); }

      <h2 class="h3" style="margin-bottom:6px">${isNew ? 'Add something good' : 'Edit this one'}</h2>

      <form id="gf" class="stack" style="gap:16px" novalidate>
        <div class="field"><label class="sr" for="gt">Your note</label><textarea class="input" id="gt" style="min-height:96px" placeholder="One little thing worth keeping" required>${esc(g?g.text:'')}</textarea></div>
        <div id="gerr"></div>
        <div class="wrap" style="justify-content:flex-end;gap:12px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn gold" type="submit">${isNew?'Into the jar':'Save'}</button></div>
      </form>`);

    d.querySelector('#gf').addEventListener('submit', async e => {
      e.preventDefault();
      try{ await API.saveGratitude({ id:g?g.id:null, text:d.querySelector('#gt').value, day:g?g.day:D.today() }); Dialog.close(); Toast(isNew?'A light more.':'Saved.', 'warm'); GratitudePage(); }
      catch(err){ d.querySelector('#gerr').innerHTML = `<div class="err-msg">${ico('alert-circle',14)}<span>${esc(err.message)}</span></div>`; icons(); }
    });
  }

  shell(`<div class="page">
    <div class="page-head"><div><span class="eyebrow">Gratitude jar</span>
      <h1 class="h1" style="margin-top:10px">Keep the small good things.</h1>
      <p>Each note becomes a light in the jar. Nothing here needs to be profound.</p></div>
      <button class="btn gold" id="add">${ico('plus',16)} Add something good</button>
    </div>
    <div class="jar-stage">
      <div class="jar-hold panel pad" style="background:linear-gradient(168deg,var(--gold-wash),var(--paper) 70%)">

      </div>
      <div class="stack" style="gap:18px">

async function CalmPage(){

  function drawTab(){

    if(tab === 'breathe'){
      box.innerHTML = `
        <div class="wrap" style="gap:10px;justify-content:center;margin-bottom:8px">
          ${BREATH_PATTERNS.map(p => `<button class="chip ${p.id===pattern.id?'on':''}" data-p="${p.id}">${p.label}</button>`).join('')}
        </div>
        <p class="meta" style="text-align:center">${esc(pattern.name)} · ${rounds} rounds</p>
        <div class="calm-stage">
          <div class="breath" id="breath">
            <div class="halo"></div><div class="ring"></div><div class="core"></div>
            <div class="stack" style="text-align:center">
              <span class="cue" id="cue">Ready when you are</span>
              <span class="cnt" id="cnt">Round 0 of ${rounds}</span>
            </div>
          </div>
          <div class="wrap" style="gap:12px;justify-content:center">
            <button class="btn" id="startb">Begin</button>
            <div class="seg">${[4,6,10].map(r=>`<button data-r="${r}" class="${r===rounds?'on':''}">${r} rounds</button>`).join('')}</div>
          </div>
        </div>`;
      $$('[data-p]').forEach(b => b.addEventListener('click', () => { stop(); pattern = BREATH_PATTERNS.find(p=>p.id===b.dataset.p); drawTab(); }));
      $$('[data-r]').forEach(b => b.addEventListener('click', () => { stop(); rounds = +b.dataset.r; drawTab(); }));
      $('#startb').addEventListener('click', () => running ? stop() : start());
    }
    else if(tab === 'ground'){
      box.innerHTML = `<div style="max-width:620px;margin-inline:auto">
        <p class="lead" style="text-align:center;margin-bottom:8px">Answer in your head or out loud. There are no wrong answers, and you can stop anywhere.</p>
        <div class="panel pad" style="margin-top:24px">
          ${GROUNDING.map((g,i) => `<div class="ground-step" style="${i?'border-top:1px solid var(--line)':''}">
            <span class="no">${g.n}</span>
            <div class="stack" style="gap:4px"><span style="font-family:var(--serif);font-size:1.2rem">${g.n === 1 ? 'One' : g.n} thing${g.n>1?'s':''} ${g.verb}</span><span class="meta">${g.hint}</span></div>
            <button class="icon-btn" data-g="${i}" aria-label="Mark step ${i+1} done" style="margin-left:auto">${ico('circle',20)}</button>
          </div>`).join('')}
        </div>
        <div class="wrap" style="justify-content:center;margin-top:24px"><button class="btn" id="gdone">I am finished</button></div>
      </div>`;
      $$('[data-g]').forEach(b => b.addEventListener('click', () => { b.innerHTML = ico('check-circle-2',20); b.style.color = 'var(--sage-2)'; icons(); }));
      $('#gdone').addEventListener('click', async () => { await API.logCalm({ kind:'grounding', detail:'5-4-3-2-1', seconds:120 }); Toast('Back in the room.', 'warm'); });
    }
    else {
      const shown = AFFIRMATIONS;
      let idx = Math.floor(seedRand(D.today() + State.me.id)() * shown.length);
      const drawAff = () => {
        const text = shown[idx];
        const isFav = favs.includes(text);
        box.innerHTML = `
          <div class="aff" style="max-width:720px;margin-inline:auto">
            <span class="eyebrow">Sit with this</span>
            <p style="margin-top:18px">${esc(text)}</p>
            <div class="wrap" style="justify-content:center;gap:12px;margin-top:28px">
              <button class="btn ghost sm" id="prev">${ico('chevron-left',15)} Before</button>
              <button class="btn sm" id="favb" style="${isFav?'background:var(--gold);color:var(--plum-deep)':''}">${ico('star',15)} ${isFav?'Kept':'Keep this'}</button>
              <button class="btn ghost sm" id="next">Another ${ico('chevron-right',15)}</button>
            </div>
          </div>
          ${favs.length ? `<div style="max-width:720px;margin:32px auto 0">
            <span class="eyebrow">Ones you keep</span>
            <div class="stack" style="gap:10px;margin-top:14px">${favs.map(f => `<div class="g-note"><span style="color:var(--gold-2)">${ico('star',15)}</span><p class="grow ital" style="font-family:var(--serif)">${esc(f)}</p><button class="icon-btn" data-unfav="${esc(f)}" aria-label="Remove">${ico('x',15)}</button></div>`).join('')}</div>
          </div>` : ''}`;
        icons();
        $('#prev').addEventListener('click', () => { idx = (idx - 1 + shown.length) % shown.length; drawAff(); });
        $('#next').addEventListener('click', () => { idx = (idx + 1) % shown.length; drawAff(); });
        $('#favb').addEventListener('click', async () => {
          const added = await API.toggleAffirmation(text);
          if(added) favs.push(text); else favs.splice(favs.indexOf(text),1);
          Toast(added ? 'Kept.' : 'Let go.'); drawAff();
        });
        $$('[data-unfav]').forEach(b => b.addEventListener('click', async () => {
          const t = b.dataset.unfav; await API.toggleAffirmation(t); favs.splice(favs.indexOf(t),1); drawAff();
        }));
      };
      drawAff();
    }
    icons();
  }

  function setScale(s, secs){
    const b = $('#breath'); if(!b) return;
    ['.halo','.ring','.core'].forEach((sel, i) => {
      const n = b.querySelector(sel);
      n.style.transitionDuration = secs + 's';
      n.style.transform = `scale(${s - i*0.04})`;
    });
  }
  function start(){
    running = true;
    $('#startb').textContent = 'Stop';
    let round = 0, pi = 0, t0 = Date.now(), elapsed = 0;
    const step = () => {
      if(!running) return;
      const [name, secs] = pattern.phases[pi];
      const cue = $('#cue'), cnt = $('#cnt');
      if(!cue) return stop();
      cue.textContent = name;
      cnt.textContent = `Round ${round+1} of ${rounds}`;
      setScale(name === 'Inhale' ? 1.0 : name === 'Exhale' ? 0.62 : (pi && pattern.phases[pi-1][0] === 'Inhale' ? 1.0 : 0.62), secs);
      timer = setTimeout(() => {
        pi++;
        if(pi >= pattern.phases.length){ pi = 0; round++; }
        if(round >= rounds){ finish(Math.round((Date.now()-t0)/1000)); return; }
        step();
      }, secs*1000);
    };
    step();
  }
  async function finish(seconds){
    running = false; clearTimeout(timer);
    const cue = $('#cue'); if(cue){ cue.textContent = 'That is the round'; $('#cnt').textContent = 'Stay as long as you like'; }
    setScale(0.8, 2);
    const sb = $('#startb'); if(sb) sb.textContent = 'Again';
    await API.logCalm({ kind:'breathing', detail:pattern.label, seconds });
    Toast('Session kept. Well done for pausing.', 'warm');
  }
  function stop(){ running = false; clearTimeout(timer); const sb = $('#startb'); if(sb) sb.textContent = 'Begin'; setScale(0.7, 1); }
  window.addEventListener('hashchange', stop, { once:true });

  shell(`<div class="page">
    <div class="page-head"><div><span class="eyebrow">Calm space</span>
      <h1 class="h1" style="margin-top:10px">Somewhere to put the next few minutes.</h1>
      <p>Breath, grounding, or a line to sit with. Leave whenever you are ready.</p></div>
      <div class="seg" id="ctabs"><button data-t="breathe" class="on">Breathe</button><button data-t="ground">Grounding</button><button data-t="aff">Affirmations</button></div>
    </div>
    <div id="calmbox"></div>
  </div>`);
  drawTab();
  $$('#ctabs button').forEach(b => b.addEventListener('click', () => { stop(); tab = b.dataset.t; $$('#ctabs button').forEach(x=>x.classList.toggle('on', x===b)); drawTab(); }));
}

/* ============================================================
   INSIGHTS
   ============================================================ */
async function InsightsPage(){
  skeletonPage();
  const snap = await API.snapshot();
  const days = Domain.activeDays(snap);
  const st = Domain.streak(days);
  const entries = snap.journal.filter(j => !j.draft);
  const moods = snap.moods;
  const monthDays = D.range(30);
  const modeMood = (() => {
    if(!moods.length) return null;
    const c = {}; moods.forEach(m => c[m.mood] = (c[m.mood]||0)+1);
    return +Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
  })();
  const habits = snap.habits.filter(h => !h.archived);
  const ranked = habits.map(h => ({ h, rate: Domain.habitRate(h, snap.completions), streak: Domain.habitStreak(h, snap.completions), growth: Domain.habitGrowth(h, snap.completions) })).sort((a,b)=>b.rate-a.rate);
  const calmSeconds = sum(snap.calm.map(c => c.seconds));
  const obs = Domain.observations(snap);
  const jStage = Domain.journeyStage(days.length);
  const ms = Domain.milestone(st.current), nx = Domain.nextMilestone(st.current);
  const thin = days.length < 3;

  const wins = [];
  if(st.current >= 3) wins.push(`${st.current} days in a row of showing up.`);
  if(entries.length) wins.push(`${entries.length} page${entries.length===1?'':'s'} written.`);
  if(snap.gratitude.length) wins.push(`${snap.gratitude.length} good thing${snap.gratitude.length===1?'':'s'} kept in the jar.`);
  if(snap.calm.length) wins.push(`${snap.calm.length} pause${snap.calm.length===1?'':'s'} in the Calm Space, about ${Math.max(1,Math.round(calmSeconds/60))} minutes.`);
  if(ranked[0] && ranked[0].growth.count) wins.push(`"${ranked[0].h.name}" reached ${ranked[0].growth.stageName.toLowerCase()}.`);
  if(Object.values(snap.moments||{}).filter(m=>m.done).length) wins.push(`${Object.values(snap.moments).filter(m=>m.done).length} small things done.`);

  shell(`<div class="page">
    <div class="page-head"><div><span class="eyebrow">Insights</span>
      <h1 class="h1" style="margin-top:10px">Your month in Solace.</h1>
      <p>Everything here is counted from your own entries. Nothing is guessed.</p></div></div>

    ${thin ? `<div class="panel pad empty"><h3 class="h2">Give Solace a little more time.</h3><p style="margin-top:10px">A few more days of anything at all, and patterns start to show here.</p>
      <div class="wrap" style="justify-content:center;margin-top:22px;gap:12px"><a class="btn" href="#/app/mood">Check in</a><a class="btn ghost" href="#/app/journal/new">Write a page</a></div></div>` : `
    <section class="ins-hero">
      <span class="eyebrow" style="color:oklch(80% 0.05 88)">${esc(D.monthName(D.today()))} so far</span>
      <h2 class="h1" style="margin-top:14px">${ms ? `${ms.name}.` : 'A beginning.'} ${st.paused ? 'Your streak paused, your progress did not disappear.' : nx ? `${nx.at - st.current} more day${nx.at-st.current===1?'':'s'} to ${nx.name.toLowerCase()}.` : 'Deeply rooted.'}</h2>
      <div class="ins-grid">
        <div class="ins-stat"><b>${st.current}</b><span>Current streak</span></div>
        <div class="ins-stat"><b>${st.longest}</b><span>Longest streak</span></div>
        <div class="ins-stat"><b>${days.length}</b><span>Days with Solace</span></div>
        <div class="ins-stat"><b>${modeMood ? MOOD_LABELS[modeMood] : '—'}</b><span>Most common mood</span></div>
      </div>
      <div style="margin-top:28px;opacity:.85">${constellation(days.slice(-40), { h:120 })}</div>
    </section>

    <section style="margin-top:36px">
      <span class="eyebrow">Your journey</span>
      <div class="panel pad" style="margin-top:14px">
        <div class="journey">
          ${JOURNEY.map((j,i) => `<div class="jstep ${days.length>=j.at?'reached':''} ${j.name===jStage.name?'now':''}">
            <div style="width:56px;height:64px">${plantSVG(i, 0)}</div><span class="lb">${j.name}</span><span class="meta num">${j.at}d</span></div>`).join('')}
        </div>
      </div>
    </section>

    <div style="display:grid;gap:20px;margin-top:36px;grid-template-columns:1fr">
      <section class="panel pad">
        <div class="tl-head" style="margin-bottom:18px"><div><span class="eyebrow">Your mood rhythm</span><h3 class="h3" style="margin-top:6px">Last 30 days</h3></div>
        <span class="meta">${moods.length} check-in${moods.length===1?'':'s'} · average energy ${moods.length?avg(moods.map(m=>m.energy)).toFixed(1):'—'}/5</span></div>
        ${moods.length ? lineChart([
          { name:'Mood', color:'var(--plum-soft)', fill:true, dots:true, map: Object.fromEntries(moods.map(m=>[m.day,m.mood])) },
          { name:'Energy', color:'var(--gold-2)', w:1.8, map: Object.fromEntries(moods.map(m=>[m.day,m.energy])) }
        ], monthDays, { aria:'Mood and energy over the last 30 days' }) : `<p class="mute small">No check-ins in this window yet.</p>`}
      </section>

      <div style="display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        <section class="panel pad">
          <span class="eyebrow">Your habits</span>
          ${ranked.length ? `<div class="bars" style="margin-top:18px">
            ${ranked.map(r => `<div class="bar-row"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.h.name)}</span>
              <span class="bar"><i style="width:${r.rate}%"></i></span><span class="meta num">${r.rate}%</span></div>`).join('')}
          </div>
          <p class="meta" style="margin-top:16px">Steadiest: ${esc(ranked[0].h.name)} · longest run ${ranked[0].streak.longest}</p>`
          : `<p class="mute small" style="margin-top:14px">Nothing planted yet. The garden is one habit away.</p>`}
        </section>

        <section class="panel pad">
          <span class="eyebrow">Your reflections</span>
          <div class="stack" style="margin-top:16px">
            <div class="kv"><span>Journal entries</span><b>${entries.length}</b></div>
            <div class="kv"><span>Words written</span><b>${sum(entries.map(e=>e.body.trim().split(/\s+/).filter(Boolean).length)).toLocaleString()}</b></div>
            <div class="kv"><span>Favourites</span><b>${entries.filter(e=>e.favorite).length}</b></div>
            <div class="kv"><span>Gratitude notes</span><b>${snap.gratitude.length}</b></div>
            <div class="kv"><span>Calm sessions</span><b>${snap.calm.length}</b></div>
            <div class="kv"><span>Mood check-ins</span><b>${moods.length}</b></div>
          </div>
        </section>
      </div>

      ${obs.length ? `<section class="panel pad">
        <span class="eyebrow">What Solace noticed</span>
        <div style="margin-top:12px">${obs.map(o => `<div class="obs"><span class="dotmark"></span><p class="small">${esc(o)}</p></div>`).join('')}</div>
        <p class="meta" style="margin-top:14px">Observations from your own entries, nothing more.</p>
      </section>` : ''}

      ${wins.length ? `<section class="panel pad" style="background:linear-gradient(160deg,var(--gold-wash),var(--paper) 66%)">
        <span class="eyebrow">Little wins</span>
        <div class="wrap" style="gap:10px;margin-top:16px">${wins.map(w => `<span class="chip" style="background:var(--paper)">${ico('sparkle',13)} ${esc(w)}</span>`).join('')}</div>
      </section>` : ''}
    </div>`}
  </div>`);
}

/* ============================================================
   SEARCH
   ============================================================ */
async function SearchPage(){
  skeletonPage();
  const snap = await API.snapshot();
  let q = '', scope = 'all';
  function draw(){
    const box = $('#sres');
    if(!q.trim()){ box.innerHTML = `<div class="empty"><h3 class="h3">Search only your own pages</h3><p>Journal entries, gratitude notes, habits and mood notes. Nothing else is looked at.</p></div>`; return; }
    const s = q.toLowerCase();
    const res = [];
    if(scope === 'all' || scope === 'journal') snap.journal.filter(j => (j.title+' '+j.body+' '+(j.tags||[]).join(' ')).toLowerCase().includes(s))
      .forEach(j => res.push({ kind:'Journal', icon:'book-open', title:j.title || 'Untitled', text:j.body.slice(0,180), day:j.day, href:'#/app/journal/' + j.id }));
    if(scope === 'all' || scope === 'gratitude') snap.gratitude.filter(g => g.text.toLowerCase().includes(s))
      .forEach(g => res.push({ kind:'Gratitude', icon:'star', title:g.text.slice(0,60), text:'', day:g.day, href:'#/app/gratitude' }));
    if(scope === 'all' || scope === 'habits') snap.habits.filter(h => (h.name+' '+h.category).toLowerCase().includes(s))
      .forEach(h => res.push({ kind:'Habit', icon:'sprout', title:h.name, text:`${h.category} · ${h.frequency}`, day:h.startDay, href:'#/app/garden' }));
    if(scope === 'all' || scope === 'mood') snap.moods.filter(m => (m.note + ' ' + (m.present||[]).join(' ')).toLowerCase().includes(s))
      .forEach(m => res.push({ kind:'Check-in', icon:'cloud-moon', title:`${MOOD_LABELS[m.mood]} day`, text:m.note.slice(0,180), day:m.day, href:'#/app/mood' }));
    res.sort((a,b)=> a.day < b.day ? 1 : -1);
    if(!res.length){ box.innerHTML = `<div class="empty"><h3 class="h3">Nothing found for &ldquo;${esc(q)}&rdquo;</h3><p>Try a shorter word, or a different corner of Solace.</p></div>`; return; }
    box.innerHTML = `<p class="meta" style="margin-bottom:14px">${res.length} result${res.length===1?'':'s'}</p>` + res.map(r => `
      <a href="${r.href}" class="entry-row" style="text-decoration:none">
        <span class="when">${D.relative(r.day)}</span>
        <span style="color:var(--plum-soft);margin-top:2px">${ico(r.icon,17)}</span>
        <span class="stack grow" style="gap:3px"><span class="small" style="font-weight:600">${esc(r.title)}</span>${r.text?`<span class="meta">${esc(r.text)}</span>`:''}</span>
        <span class="chip tag">${r.kind}</span>
      </a>`).join('');
    icons();
  }
  shell(`<div class="page">
    <div class="page-head"><div><span class="eyebrow">Search</span><h1 class="h1" style="margin-top:10px">Find what you wrote.</h1></div></div>
    <div class="wrap" style="gap:10px;margin-bottom:22px">
      <input class="input grow" id="sq" type="search" placeholder="A word, a name, a feeling" style="max-width:420px" autofocus>
      <div class="seg" id="sscope">${[['all','All'],['journal','Journal'],['gratitude','Jar'],['habits','Habits'],['mood','Check-ins']].map((x,i)=>`<button data-s="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('')}</div>
    </div>
    <div class="panel pad" id="sres"></div>
  </div>`);
  draw();
  $('#sq').addEventListener('input', e => { q = e.target.value; draw(); });
  $$('#sscope button').forEach(b => b.addEventListener('click', () => { scope = b.dataset.s; $$('#sscope button').forEach(x=>x.classList.toggle('on', x===b)); draw(); }));
  $('#sq').focus();
}

/* ============================================================
   PROFILE
   ============================================================ */
async function ProfilePage(){
  skeletonPage();
  const [snap, me] = await Promise.all([API.snapshot(), API.me()]);
  State.me = me;
  const days = Domain.activeDays(snap);
  const st = Domain.streak(days);
  const joined = new Date(me.createdAt);
  const jStage = Domain.journeyStage(days.length);

  shell(`<div class="page">
    <div class="page-head"><div><span class="eyebrow">Profile</span><h1 class="h1" style="margin-top:10px">Your corner of Solace.</h1></div>
      <button class="btn ghost" id="out">${ico('log-out',16)} Log out</button></div>

    <section class="panel pad" style="background:linear-gradient(150deg,var(--lav),var(--paper) 68%);margin-bottom:24px">
      <div class="prof-head">
        <div style="position:relative">
          ${avatarHTML(me,'xl')}
          <label class="icon-btn" style="position:absolute;bottom:-4px;right:-4px;background:var(--paper);border:1px solid var(--line);cursor:pointer" title="Change avatar">
            ${ico('camera',16)}<input type="file" id="av" accept="image/*" class="sr"></label>
        </div>
        <div class="stack grow" style="gap:6px">
          <h2 class="h2">${esc(me.name)}</h2>
          <span class="meta">${esc(me.email)} · here since ${joined.toLocaleDateString(undefined,{month:'long', year:'numeric'})}</span>
          <div class="wrap" style="gap:8px;margin-top:8px">
            <span class="badge">${ico('sparkle',13)} ${jStage.name}</span>
            <span class="badge" style="background:var(--paper)">${st.current} day streak</span>
            <span class="badge" style="background:var(--paper)">best ${st.longest}</span>
          </div>
        </div>
        <div style="width:96px;flex:none">${plantSVG(JOURNEY.findIndex(j=>j.name===jStage.name), 1)}</div>
      </div>
    </section>

    <div class="prof-grid">
      <div class="stack" style="gap:24px">
        <section class="panel pad">
          <span class="eyebrow">Your details</span>
          <form id="pf" class="stack" style="gap:16px;margin-top:16px">
            <div class="field"><label for="pn">Name</label><input class="input" id="pn" value="${esc(me.name)}"></div>
            <div class="field"><label for="pb">A line about now</label><input class="input" id="pb" value="${esc(me.profile.bio||'')}" placeholder="Trying to go slower this season"></div>
            <div><p class="small" style="font-weight:600;margin-bottom:10px">What brings you to Solace</p>
              <div class="wrap" style="gap:8px">${REASONS.map(r => `<button type="button" class="chip" data-r="${esc(r)}" aria-pressed="${(me.profile.reasons||[]).includes(r)}">${esc(r)}</button>`).join('')}</div></div>
            <div><p class="small" style="font-weight:600;margin:6px 0 10px">Wellness goals</p>
              <div class="stack" style="gap:10px" id="goals">
                ${(me.profile.goals||[]).concat(['','']).slice(0,4).map((g,i)=>`<input class="input" data-g="${i}" value="${esc(g)}" placeholder="${i?'Another, if you like':'Sleep before midnight most nights'}">`).join('')}
              </div></div>
            <div class="wrap"><button class="btn" type="submit">Save changes</button></div>
          </form>
        </section>

        <section class="panel pad">
          <span class="eyebrow">Password</span>
          <form id="cp" class="stack" style="gap:16px;margin-top:16px;max-width:420px">
            <div class="field"><label for="c1">Current password</label><input class="input" id="c1" type="password" autocomplete="current-password"></div>
            <div class="field"><label for="c2">New password</label><input class="input" id="c2" type="password" autocomplete="new-password"></div>
            <div id="cperr"></div>
            <div class="wrap"><button class="btn ghost" type="submit">Update password</button></div>
          </form>
        </section>
      </div>

      <aside class="stack" style="gap:24px">
        <section class="panel pad">
          <span class="eyebrow">Where you have been</span>
          <div class="stack" style="margin-top:14px">
            <div class="kv"><span>Days with Solace</span><b>${days.length}</b></div>
            <div class="kv"><span>Current streak</span><b>${st.current}</b></div>
            <div class="kv"><span>Longest streak</span><b>${st.longest}</b></div>
            <div class="kv"><span>Journal entries</span><b>${snap.journal.filter(j=>!j.draft).length}</b></div>
            <div class="kv"><span>Habits planted</span><b>${snap.habits.length}</b></div>
            <div class="kv"><span>Gratitude notes</span><b>${snap.gratitude.length}</b></div>
            <div class="kv"><span>Mood check-ins</span><b>${snap.moods.length}</b></div>
            <div class="kv"><span>Calm sessions</span><b>${snap.calm.length}</b></div>
          </div>
        </section>
        <section class="sky-box">
          <span class="eyebrow" style="color:oklch(80% 0.05 88)">Your constellation</span>
          <div style="margin-top:12px">${constellation(days.slice(-30), { h:170 })}</div>
          <p class="cap" style="margin-top:10px">One star for every day you showed up.</p>
        </section>
      </aside>
    </div>
  </div>`);

  let reasons = new Set(me.profile.reasons || []);
  $$('[data-r]').forEach(b => b.addEventListener('click', () => {
    const r = b.dataset.r; reasons.has(r) ? reasons.delete(r) : reasons.add(r);
    b.setAttribute('aria-pressed', reasons.has(r));
  }));
  $('#av').addEventListener('change', async e => {
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 1_200_000) return Toast('That image is a little large. Under 1.2MB works best.');
    const r = new FileReader();
    r.onload = async () => { State.me = await API.updateMe({ avatar:r.result }); Toast('New face, same corner.', 'warm'); ProfilePage(); };
    r.readAsDataURL(f);
  });
  $('#pf').addEventListener('submit', async e => {
    e.preventDefault();
    try{
      State.me = await API.updateMe({ name:$('#pn').value, bio:$('#pb').value, reasons:Array.from(reasons), goals:$$('#goals [data-g]').map(i=>i.value.trim()).filter(Boolean) });
      Toast('Saved.'); ProfilePage();
    }catch(err){ Toast(err.message); }
  });
  $('#cp').addEventListener('submit', async e => {
    e.preventDefault();
    const box = $('#cperr'); box.innerHTML = '';
    try{ await API.changePassword({ current:$('#c1').value, next:$('#c2').value }); $('#c1').value = ''; $('#c2').value = ''; Toast('Password updated.'); }
    catch(err){ box.innerHTML = `<div class="err-msg">${ico('alert-circle',14)}<span>${esc(err.message)}</span></div>`; icons(); }
  });
  $('#out').addEventListener('click', logout);
}

/* ===================== go ===================== */
window.addEventListener('error', e => console.warn('Solace caught:', e.message));
boot();
})();
